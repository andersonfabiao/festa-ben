<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Ben faz 5 anos no quarto do Andy</title>
  <desc id="desc">Convite inspirado no quarto do Andy para o aniversário do Ben em 9 de janeiro de 2027, às 18 horas.</desc>
  <defs>
    <pattern id="clouds" width="260" height="165" patternUnits="userSpaceOnUse">
      <g fill="#fff" fill-opacity=".84">
        <ellipse cx="78" cy="92" rx="61" ry="23"/>
        <circle cx="50" cy="78" r="28"/>
        <circle cx="85" cy="68" r="38"/>
        <circle cx="118" cy="82" r="24"/>
      </g>
    </pattern>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#d89b53"/><stop offset="1" stop-color="#a55d28"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#31546b" flood-opacity=".3"/>
    </filter>
    <clipPath id="portrait"><circle cx="34" cy="34" r="31"/></clipPath>
  </defs>

  <rect width="1200" height="630" fill="#6cc5ef"/>
  <rect width="1200" height="500" fill="url(#clouds)"/>
  <rect y="500" width="1200" height="130" fill="url(#floor)"/>
  <path d="M0 510h1200" stroke="#fff0c9" stroke-width="20"/>
  <path d="M0 521h1200" stroke="#7e411d" stroke-width="7" opacity=".7"/>
  <g opacity=".3" stroke="#75401f" stroke-width="3">
    <path d="M180 520l-20 110M430 520l8 110M720 520l-12 110M1010 520l20 110"/>
  </g>

  <g transform="translate(441 0)">
    <path d="M0 0h53L27 57z" fill="#e8453c"/><path d="M53 0h53L80 57z" fill="#ffd13f"/>
    <path d="M106 0h53l-26 57z" fill="#3b83d3"/><path d="M159 0h53l-26 57z" fill="#e8453c"/>
    <path d="M212 0h53l-26 57z" fill="#ffd13f"/><path d="M265 0h53l-26 57z" fill="#3b83d3"/>
  </g>

  <g transform="translate(386 56) rotate(-1)">
    <rect width="428" height="42" rx="6" fill="#fff5c8" stroke="#c79a54" stroke-width="2"/>
    <text x="214" y="27" fill="#72501d" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3" text-anchor="middle">UM RECADO NO QUARTO DO ANDY</text>
  </g>

  <text x="600" y="139" fill="#174f80" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="4" text-anchor="middle">OS BRINQUEDOS ESTÃO PREPARANDO UMA FESTA</text>
  <text x="600" y="281" fill="#ffd13f" stroke="#d93f35" stroke-width="5" paint-order="stroke" font-family="Arial Rounded MT Bold, Arial, sans-serif" font-size="148" font-weight="900" text-anchor="middle" filter="url(#shadow)">BEN</text>
  <text x="600" y="335" fill="#174f80" font-family="Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="2" text-anchor="middle">FAZ <tspan fill="#e8453c" font-size="58">5</tspan> ANOS</text>
  <text x="600" y="376" fill="#174f80" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">E você faz parte dessa brincadeira!</text>

  <g transform="translate(358 395)" filter="url(#shadow)">
