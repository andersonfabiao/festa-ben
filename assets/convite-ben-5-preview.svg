<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Ben faz 5 anos</title>
  <desc id="desc">Convite cinematográfico para o aniversário do Ben em 9 de janeiro de 2027, às 18 horas.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#061126"/>
      <stop offset="0.68" stop-color="#0b2a58"/>
      <stop offset="1" stop-color="#17477d"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#469ce8" stop-opacity=".55"/>
      <stop offset="1" stop-color="#469ce8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="curtain" x1="0" x2="1">
      <stop stop-color="#5d1019"/>
      <stop offset=".45" stop-color="#b62830"/>
      <stop offset=".72" stop-color="#6b111c"/>
      <stop offset="1" stop-color="#cf3a3d"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000" flood-opacity=".5"/>
    </filter>
    <clipPath id="portrait"><circle cx="25" cy="25" r="23"/></clipPath>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="600" cy="330" rx="470" ry="360" fill="url(#glow)"/>
  <path d="M0 0h218l-96 630H0z" fill="url(#curtain)" opacity=".55"/>
  <path d="M1200 0H982l96 630h122z" fill="url(#curtain)" opacity=".55"/>
  <g fill="#fff7b4">
    <circle cx="286" cy="93" r="3"/><circle cx="905" cy="123" r="3"/><circle cx="1001" cy="300" r="2"/><circle cx="223" cy="361" r="2"/>
    <path d="M337 169l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/><path d="M871 209l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>
  </g>
  <text x="600" y="71" fill="#ffe27d" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="8" text-anchor="middle">BEN STUDIOS APRESENTA</text>
  <g transform="translate(405 103)" filter="url(#shadow)">
    <g transform="translate(0 0)"><image href="personagens/rex.jpg" width="50" height="50" preserveAspectRatio="xMidYMid slice" clip-path="url(#portrait)"/><circle cx="25" cy="25" r="24" fill="none" stroke="#fff" stroke-width="2"/></g>
    <g transform="translate(56 0)"><image href="personagens/sr-cabeca-de-batata.jpg" width="50" height="50" preserveAspectRatio="xMidYMid slice" clip-path="url(#portrait)"/><circle cx="25" cy="25" r="24" fill="none" stroke="#fff" stroke-width="2"/></g>
    <g transform="translate(112 -7)"><image href="personagens/woody.jpg" width="50" height="50" preserveAspectRatio="xMidYMid slice" clip-path="url(#portrait)"/><circle cx="25" cy="25" r="24" fill="none" stroke="#ffd144" stroke-width="3"/></g>
    <g transform="translate(168 -7)"><image href="personagens/buzz.jpg" width="50" height="50" preserveAspectRatio="xMidYMid slice" clip-path="url(#portrait)"/><circle cx="25" cy="25" r="24" fill="none" stroke="#ffd144" stroke-width="3"/></g>
    <g transform="translate(224 -7)"><image href="personagens/jessie.jpg" width="50" height="50" preserveAspectRatio="xMidYMid slice" clip-path="url(#portrait)"/><circle cx="25" cy="25" r="24" fill="none" stroke="#ffd144" stroke-width="3"/></g>
    <g transform="translate(280 0)"><image href="personagens/alienigenas.jpg" width="50" height="50" preserveAspectRatio="xMidYMid slice" clip-path="url(#portrait)"/><circle cx="25" cy="25" r="24" fill="none" stroke="#fff" stroke-width="2"/></g>
    <g transform="translate(336 0)"><image href="personagens/garfinho.jpg" width="50" height="50" preserveAspectRatio="xMidYMid slice" clip-path="url(#portrait)"/><circle cx="25" cy="25" r="24" fill="none" stroke="#fff" stroke-width="2"/></g>
  </g>
  <text x="600" y="221" fill="#dcecff" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="5" text-anchor="middle">UMA NOVA AVENTURA ESTÁ CHEGANDO</text>
  <text x="600" y="365" fill="#ffd144" stroke="#d84735" stroke-width="3" paint-order="stroke" font-family="Arial Rounded MT Bold, Arial, sans-serif" font-size="154" font-weight="900" text-anchor="middle" filter="url(#shadow)">BEN</text>
  <text x="600" y="421" fill="#fff" font-family="Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="2" text-anchor="middle">FAZ <tspan fill="#ffd144" font-size="58">5</tspan> ANOS</text>
  <text x="600" y="475" fill="#dcecff" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle">Prepare-se para brincar até o infinito e além!</text>
  <g transform="translate(326 515)">
    <rect width="548" height="62" rx="18" fill="#fff" opacity=".96"/>
    <text x="274" y="25" fill="#17365d" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">9 DE JANEIRO DE 2027  •  18H</text>
    <text x="274" y="48" fill="#315b82" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">ENJOY — LIV MALL SHOPPING</text>
  </g>
  <rect y="615" width="1200" height="15" fill="#f8c841"/>
  <rect x="200" y="615" width="200" height="15" fill="#db3c34"/><rect x="600" y="615" width="200" height="15" fill="#3488dc"/><rect x="1000" y="615" width="200" height="15" fill="#db3c34"/>
</svg>
