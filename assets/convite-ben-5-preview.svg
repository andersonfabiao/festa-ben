<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Confirmação de presença — Ben faz 5 anos</title>
  <desc id="desc">Página para confirmar presença no aniversário do Ben.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#58bcea"/><stop offset="1" stop-color="#bceaff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#14547e" flood-opacity=".24"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#sky)"/>
  <g fill="#fff" opacity=".62">
    <ellipse cx="110" cy="135" rx="84" ry="28"/><circle cx="75" cy="112" r="39"/><circle cx="124" cy="99" r="52"/><circle cx="172" cy="119" r="33"/>
    <ellipse cx="1088" cy="465" rx="92" ry="31"/><circle cx="1047" cy="440" r="43"/><circle cx="1102" cy="425" r="56"/><circle cx="1152" cy="448" r="35"/>
  </g>
  <g fill="#ffe56d"><path d="M1064 90l5 13 13 5-13 5-5 13-5-13-13-5 13-5z"/><path d="M98 505l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/></g>

  <g transform="translate(105 75)" filter="url(#shadow)">
    <rect width="990" height="480" rx="38" fill="#fff"/>
    <path d="M0 440h990v40H0z" fill="#f3f8fc"/>
    <path d="M0 440h990" stroke="#e4edf4" stroke-width="2"/>
    <g transform="translate(56 46)">
      <image href="pngall/logo-toy-story.png" width="118" height="87" preserveAspectRatio="xMidYMid meet"/>
      <text x="0" y="135" fill="#b13730" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="4">CONFIRMAÇÃO DE PRESENÇA</text>
      <text x="0" y="218" fill="#123a66" font-family="Arial Rounded MT Bold, Arial, sans-serif" font-size="56" font-weight="900">Ben faz <tspan fill="#e8453c">5</tspan> anos!</text>
      <text x="0" y="264" fill="#345a7d" font-family="Arial, sans-serif" font-size="20" font-weight="600">Encontre seu nome e confirme se você vai.</text>
      <g transform="translate(0 305)">
        <rect width="405" height="68" rx="15" fill="#edf6fc" stroke="#d3e5f2" stroke-width="2"/>
        <text x="202" y="28" fill="#17365d" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">9 DE JANEIRO DE 2027  •  18H</text>
        <text x="202" y="51" fill="#315b82" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">ENJOY — LIV MALL SHOPPING</text>
      </g>
    </g>
    <g transform="translate(598 86)">
      <circle cx="170" cy="180" r="170" fill="#e7f7ff"/>
      <image href="pngall/personagens-toy-story.png" x="-5" y="42" width="355" height="285" preserveAspectRatio="xMidYMid meet"/>
      <g transform="translate(289 -8) rotate(7)">
        <circle cx="38" cy="38" r="37" fill="#ffcf3d" stroke="#fff" stroke-width="4"/>
        <text x="38" y="38" fill="#7a4b00" font-family="Arial, sans-serif" font-size="29" font-weight="900" text-anchor="middle">5</text>
        <text x="38" y="55" fill="#7a4b00" font-family="Arial, sans-serif" font-size="10" font-weight="800" letter-spacing="1" text-anchor="middle">ANOS</text>
      </g>
    </g>
    <text x="495" y="465" fill="#537089" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Resposta rápida e segura pelo link do convite</text>
  </g>
