  <g transform="translate(1052 542) rotate(3)"><rect width="48" height="48" rx="5" fill="#3b83d3" stroke="#fff" stroke-width="3"/><text x="24" y="35" fill="#fff" font-family="Arial" font-size="29" font-weight="900" text-anchor="middle">E</text></g>
  <g transform="translate(1102 548) rotate(-2)"><rect width="48" height="48" rx="5" fill="#e5ad1f" stroke="#fff" stroke-width="3"/><text x="24" y="35" fill="#fff" font-family="Arial" font-size="29" font-weight="900" text-anchor="middle">N</text></g>

  <g transform="translate(326 538)">
