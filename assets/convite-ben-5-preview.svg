    <text x="274" y="26" fill="#17365d" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">9 DE JANEIRO DE 2027  •  18H</text>
    <text x="274" y="49" fill="#315b82" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">ENJOY — LIV MALL SHOPPING</text>
