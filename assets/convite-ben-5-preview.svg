    <g transform="translate(70 0)"><image href="personagens/sr-cabeca-de-batata.jpg" width="68" height="68" preserveAspectRatio="xMidYMid slice" clip-path="url(#portrait)"/><circle cx="34" cy="34" r="32" fill="none" stroke="#fff" stroke-width="3"/></g>
    <g transform="translate(140 -8)"><image href="personagens/woody.jpg" width="68" height="68" preserveAspectRatio="xMidYMid slice" clip-path="url(#portrait)"/><circle cx="34" cy="34" r="32" fill="none" stroke="#ffd13f" stroke-width="4"/></g>
    <g transform="translate(210 -8)"><image href="personagens/buzz.jpg" width="68" height="68" preserveAspectRatio="xMidYMid slice" clip-path="url(#portrait)"/><circle cx="34" cy="34" r="32" fill="none" stroke="#ffd13f" stroke-width="4"/></g>
    <g transform="translate(280 -8)"><image href="personagens/jessie.jpg" width="68" height="68" preserveAspectRatio="xMidYMid slice" clip-path="url(#portrait)"/><circle cx="34" cy="34" r="32" fill="none" stroke="#ffd13f" stroke-width="4"/></g>
    <g transform="translate(350 0)"><image href="personagens/alienigenas.jpg" width="68" height="68" preserveAspectRatio="xMidYMid slice" clip-path="url(#portrait)"/><circle cx="34" cy="34" r="32" fill="none" stroke="#fff" stroke-width="3"/></g>
    <g transform="translate(420 0)"><image href="personagens/garfinho.jpg" width="68" height="68" preserveAspectRatio="xMidYMid slice" clip-path="url(#portrait)"/><circle cx="34" cy="34" r="32" fill="none" stroke="#fff" stroke-width="3"/></g>
  </g>
  <rect x="335" y="464" width="530" height="14" rx="4" fill="#b86b2e"/>
  <rect x="335" y="476" width="530" height="8" rx="4" fill="#75401f"/>

  <g transform="translate(43 538)">
    <circle cx="34" cy="34" r="31" fill="#ffd641" stroke="#fff" stroke-width="5"/>
    <path d="M13 14l42 42M55 14L13 56" stroke="#3c86d8" stroke-width="17"/>
